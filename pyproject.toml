[project]
name = "ollama-runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fasttext>=0.9.3",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "returns>=0.29.0",
]

[project.scripts]
ollama-runner = "ollama_runner.main:main"
emb = "ollama_runner.embeeding:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers = [
    "embed: vector embedding resolver only",
    "pipeline: llm + embedding e2e",
    "unit: no ollama/postgres/fasttext",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
